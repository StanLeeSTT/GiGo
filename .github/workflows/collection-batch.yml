name: GiGo safe collection batch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gigo-safe-collection-batch
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/feat/universal-collection-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/universal-collection-engine
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run one bounded collection batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          DECODO_API_KEY: ${{ secrets.DECODO_API_KEY }}
        run: node --experimental-strip-types scripts/collection-batch-worker.mjs
