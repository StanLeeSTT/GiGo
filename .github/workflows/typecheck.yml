name: TypeScript typecheck

on:
  push:
    branches:
      - feat/universal-collection-engine
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Browser JavaScript syntax check
        run: find public -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Collection engine tests
        run: npm test
