name: GiGo safe collection provider health check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gigo-safe-collection-health
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/feat/universal-collection-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/universal-collection-engine
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify runner and promote provider health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/collection-batch-worker.mjs --health-check
