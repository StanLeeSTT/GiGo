name = "gigo-api"
main = "src/index.ts"
compatibility_date = "2026-11-17"
workers_dev = true

[vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://gigo-api.thegreatmind601.workers.dev"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/healthz"]

[triggers]
crons = ["* * * * *"]
